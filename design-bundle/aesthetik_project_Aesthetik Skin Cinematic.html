<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const {useRef,useEffect,useState,useCallback}=React;

/* ── Aqua palette ── */
const AQ1=0x00d4e8,AQ2=0x4ecdc4,AQ3=0x00b4d8,AQ4=0x0077b6,AQ5=0x7fe8f0;

/* ── Three helpers ── */
function buildMolecularScene(renderer,scene,camera,el){
  const T=window.THREE;
  camera.position.z=30;
  scene.add(new T.AmbientLight(AQ1,.4));
  const dl=new T.DirectionalLight(AQ1,1.5);dl.position.set(6,10,8);scene.add(dl);
  const dl2=new T.DirectionalLight(AQ3,.6);dl2.position.set(-8,-5,4);scene.add(dl2);
  const grp=new T.Group();scene.add(grp);
  const SIZES=[.12,.18,.28,.38,.5];
  const pts=[];
  for(let i=0;i<50;i++){
    const sz=SIZES[Math.floor(Math.random()*SIZES.length)];
    const mat=new T.MeshPhysicalMaterial({color:new T.Color(AQ1),transparent:true,opacity:.15+Math.random()*.18,roughness:0,metalness:0,transmission:.85,thickness:.5,emissive:new T.Color(AQ2),emissiveIntensity:.14});
    const m=new T.Mesh(new T.SphereGeometry(sz,20,20),mat);
    const r=5+Math.random()*10,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    m.position.set(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph));
    m.userData={baseY:m.position.y,speed:.4+Math.random()*.6,phase:Math.random()*Math.PI*2};
    pts.push(m.position.clone());grp.add(m);
  }
  const lm=new T.LineBasicMaterial({color:AQ1,transparent:true,opacity:.09});
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++)
    if(pts[i].distanceTo(pts[j])<5.2){grp.add(new T.Line(new T.BufferGeometry().setFromPoints([pts[i],pts[j]]),lm));}
  const addT=(r,tube,col,rx,ry,op)=>{
    const m=new T.Mesh(new T.TorusGeometry(r,tube,16,100),new T.MeshPhysicalMaterial({color:col,transparent:true,opacity:op,roughness:0,transmission:.6,emissive:new T.Color(col),emissiveIntensity:.15}));
    m.rotation.set(rx,ry,0);grp.add(m);return m;
  };
  const t1=addT(5,.05,AQ1,Math.PI/3,.2,.35);
  const t2=addT(8,.03,AQ3,Math.PI/6,Math.PI/4,.2);
  const t3=addT(3.5,.04,AQ2,.9,.5,.28);
  const pa=new Float32Array(400*3);for(let i=0;i<pa.length;i++)pa[i]=(Math.random()-.5)*60;
  scene.add(new T.Points(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(pa,3)),new T.PointsMaterial({color:AQ5,size:.07,transparent:true,opacity:.4})));
  let raf,tick=0;
  const mouse={x:0,y:0};
  const om=e=>{mouse.x=(e.clientX/window.innerWidth-.5)*.6;mouse.y=(e.clientY/window.innerHeight-.5)*-.4;};
  window.addEventListener('mousemove',om);
  const animate=()=>{raf=requestAnimationFrame(animate);tick+=.004;
    grp.rotation.y=tick*.14+mouse.x;grp.rotation.x=tick*.06+mouse.y;
    t1.rotation.z=tick*.2;t2.rotation.z=-tick*.12;t3.rotation.z=tick*.16;
    grp.children.forEach(c=>{if(c.userData?.baseY!=null){c.position.y=c.userData.baseY+Math.sin(tick*c.userData.speed+c.userData.phase)*.5;}});
    renderer.render(scene,camera);};
  animate();
  return()=>{cancelAnimationFrame(raf);window.removeEventListener('mousemove',om);};
}

function buildDNAScene(renderer,scene,camera){
  const T=window.THREE;
  camera.position.z=22;
  scene.add(new T.AmbientLight(AQ2,.35));
  const dl=new T.DirectionalLight(AQ1,1.8);dl.position.set(8,8,6);scene.add(dl);
  const dl2=new T.DirectionalLight(AQ3,.6);dl2.position.set(-6,-4,3);scene.add(dl2);
  const hg=new T.Group();
  const sGeo=new T.SphereGeometry(.14,14,14);
  const STEPS=70;
  for(let i=0;i<STEPS;i++){
    const t=(i/STEPS)*Math.PI*7,y=(i/STEPS)*28-14,col=[AQ1,AQ2,AQ3,AQ4,AQ5][i%5];
    const bmat=new T.MeshPhysicalMaterial({color:col,transparent:true,opacity:.7,roughness:0,transmission:.5,emissive:new T.Color(col),emissiveIntensity:.12});
    const m1=new T.Mesh(sGeo,bmat);m1.position.set(Math.cos(t)*3.5,y,Math.sin(t)*1.8);hg.add(m1);
    const m2=new T.Mesh(sGeo,bmat.clone());m2.material.opacity=.4;
    m2.position.set(Math.cos(t+Math.PI)*3.5,y,Math.sin(t+Math.PI)*1.8);hg.add(m2);
    if(i%4===0){
      const mid=m1.position.clone().lerp(m2.position,.5),dist=m1.position.distanceTo(m2.position);
      const rung=new T.Mesh(new T.CylinderGeometry(.025,.025,dist,8),new T.MeshPhysicalMaterial({color:AQ1,transparent:true,opacity:.2,roughness:0,transmission:.7}));
      rung.position.copy(mid);rung.lookAt(m2.position);rung.rotateX(Math.PI/2);hg.add(rung);
    }
  }
  hg.position.set(11,0,-4);hg.scale.setScalar(.72);scene.add(hg);
  [[4,.04,AQ1,[-9,3,-2],.5,.3],[2.8,.035,AQ2,[-7,-5,-1],.8,.2],[7,.025,AQ3,[5,5,-10],.3,.6]].forEach(([r,tube,col,pos,rx,ry])=>{
    const m=new T.Mesh(new T.TorusGeometry(r,tube,14,90),new T.MeshPhysicalMaterial({color:col,transparent:true,opacity:.28,roughness:0,transmission:.6,emissive:new T.Color(col),emissiveIntensity:.12}));
    m.position.set(...pos);m.rotation.set(rx,ry,0);m.userData={rx,ry};scene.add(m);
  });
  const pa=new Float32Array(500*3);for(let i=0;i<pa.length;i++)pa[i]=(Math.random()-.5)*65;
  scene.add(new T.Points(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(pa,3)),new T.PointsMaterial({color:AQ5,size:.06,transparent:true,opacity:.28})));
  let raf,tick=0;
  const animate=()=>{raf=requestAnimationFrame(animate);tick+=.004;
    hg.rotation.y=tick*.25;
    scene.children.forEach(c=>{if(c.userData?.rx!=null){c.rotation.z=tick*.08;c.rotation.x=c.userData.rx+Math.sin(tick*.4)*.08;}});
    renderer.render(scene,camera);};
  animate();
  return()=>cancelAnimationFrame(raf);
}

function buildCrystalsScene(renderer,scene,camera){
  const T=window.THREE;
  camera.position.z=20;
  scene.add(new T.AmbientLight(AQ2,.4));
  const dl=new T.DirectionalLight(AQ1,2);dl.position.set(8,10,6);scene.add(dl);
  const dl2=new T.DirectionalLight(AQ3,.8);dl2.position.set(-8,-6,4);scene.add(dl2);
  const all=[];
  [[.4,18],[.7,10],[1.1,6],[1.8,4]].forEach(([r,n])=>{
    for(let i=0;i<n;i++){
      const mat=new T.MeshPhysicalMaterial({color:new T.Color(AQ1),transparent:true,opacity:.1+Math.random()*.2,roughness:0,transmission:.88,thickness:.6,emissive:new T.Color(AQ2),emissiveIntensity:.15});
      const m=new T.Mesh(Math.random()>.5?new T.IcosahedronGeometry(r,0):new T.OctahedronGeometry(r),mat);
      m.position.set((Math.random()-.5)*28,(Math.random()-.5)*18,(Math.random()-.5)*12);
      m.userData={rx:.01+Math.random()*.015,ry:.008+Math.random()*.012,rz:Math.random()*.01};
      scene.add(m);all.push(m);
    }
  });
  [[5,.06,AQ1,Math.PI/4,.3],[9,.04,AQ3,.6,Math.PI/5],[3,.05,AQ2,1.2,.8]].forEach(([r,t,c,rx,ry],i)=>{
    const m=new T.Mesh(new T.TorusGeometry(r,t,16,80),new T.MeshPhysicalMaterial({color:c,transparent:true,opacity:.32,roughness:0,transmission:.5,emissive:new T.Color(c),emissiveIntensity:.18}));
    m.rotation.set(rx,ry,0);m.userData={rx,ry,spin:i};
    scene.add(m);all.push(m);
  });
  const pa=new Float32Array(400*3);for(let i=0;i<pa.length;i++)pa[i]=(Math.random()-.5)*50;
  scene.add(new T.Points(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(pa,3)),new T.PointsMaterial({color:AQ5,size:.06,transparent:true,opacity:.28})));
  let raf,tick=0;
  const animate=()=>{raf=requestAnimationFrame(animate);tick+=.005;
    all.forEach(c=>{c.rotation.x+=c.userData.rx||.005;c.rotation.y+=c.userData.ry||.008;c.rotation.z+=c.userData.rz||0;});
    renderer.render(scene,camera);};
  animate();
  return()=>cancelAnimationFrame(raf);
}

function buildWaveScene(renderer,scene,camera){
  const T=window.THREE;
  camera.position.z=16;
  scene.add(new T.AmbientLight(AQ3,.5));
  const dl=new T.DirectionalLight(AQ1,1.8);dl.position.set(0,10,8);scene.add(dl);
  const COLS=50,ROWS=30;
  const ptsArr=[],cols=[];
  const cA=new T.Color(AQ1),cB=new T.Color(AQ2),cC=new T.Color(AQ5);
  for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){
    ptsArr.push((i-COLS/2)*.7,(j-ROWS/2)*.7,0);
    const c=Math.random()<.4?cA:Math.random()<.5?cB:cC;
    cols.push(c.r,c.g,c.b);
  }
  const geo=new T.BufferGeometry();
  geo.setAttribute('position',new T.BufferAttribute(new Float32Array(ptsArr),3));
  geo.setAttribute('color',new T.BufferAttribute(new Float32Array(cols),3));
  const posArr=geo.attributes.position.array;
  scene.add(new T.Points(geo,new T.PointsMaterial({size:.12,transparent:true,opacity:.5,vertexColors:true})));
  const bubbles=[];
  for(let i=0;i<25;i++){
    const r=.1+Math.random()*.55;
    const m=new T.Mesh(new T.SphereGeometry(r,18,18),new T.MeshPhysicalMaterial({color:AQ1,transparent:true,opacity:.08+Math.random()*.14,roughness:0,transmission:.9,emissive:new T.Color(AQ2),emissiveIntensity:.18}));
    m.position.set((Math.random()-.5)*22,(Math.random()-.5)*15,(Math.random()-.5)*5);
    m.userData={vy:.2+Math.random()*.4};
    scene.add(m);bubbles.push(m);
  }
  let raf,tick=0;
  const animate=()=>{raf=requestAnimationFrame(animate);tick+=.012;
    for(let i=0;i<COLS*ROWS;i++){const x=posArr[i*3],y=posArr[i*3+1];posArr[i*3+2]=Math.sin(x*.4+tick)*1.2+Math.cos(y*.3+tick*.7)*.8;}
    geo.attributes.position.needsUpdate=true;
    bubbles.forEach(b=>{b.position.y+=b.userData.vy*.018;if(b.position.y>10)b.position.y=-10;});
    renderer.render(scene,camera);};
  animate();
  return()=>cancelAnimationFrame(raf);
}

function ThreeBg({type='molecular'}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el||!window.THREE)return;
    const T=window.THREE;
    const W=el.offsetWidth,H=el.offsetHeight;
    const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H);
    renderer.setClearColor(0x000000,0);renderer.domElement.className='bg3d';
    el.appendChild(renderer.domElement);
    const scene=new T.Scene();
    const camera=new T.PerspectiveCamera(55,W/H,.1,200);
    const builders={molecular:buildMolecularScene,dna:buildDNAScene,crystals:buildCrystalsScene,wave:buildWaveScene};
    const cleanup=(builders[type]||buildMolecularScene)(renderer,scene,camera,el);
    const onResize=()=>{const nw=el.offsetWidth,nh=el.offsetHeight;camera.aspect=nw/nh;camera.updateProjectionMatrix();renderer.setSize(nw,nh);};
    window.addEventListener('resize',onResize);
    return()=>{cleanup?.();window.removeEventListener('resize',onResize);renderer.dispose();el.contains(renderer.domElement)&&el.removeChild(renderer.domElement);};
  },[type]);
  return <div ref={ref} style={{position:'absolute',inset:0,zIndex:0}}/>;
}

/* ── BlurText ── */
function BlurText({text,className}){
  const ref=useRef(null);const[go,setGo]=useState(false);
  useEffect(()=>{const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setGo(true);obs.disconnect();}},{threshold:.1});if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();},[]);
  return(
    <p ref={ref} className={className} style={{display:'flex',flexWrap:'wrap',justifyContent:'center',rowGap:'.1em'}}>
      {text.split(' ').map((w,i)=><span key={i} className={'word'+(go?' go':'')} style={{animationDelay:go?`${.3+i*.1}s`:'9999s'}}>{w}</span>)}
    </p>
  );
}

/* ── useReveal ── */
function useReveal(delay=0){
  const ref=useRef(null);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setTimeout(()=>{if(ref.current)ref.current.classList.add('vis');},delay);obs.disconnect();}},{threshold:.1});
    if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
  },[delay]);
  return ref;
}

function Hero(){
  return(
    <section className="relative w-full overflow-hidden bg-black flex flex-col" style={{minHeight:'100vh'}}>
      <ThreeBg type="molecular"/>
      <div style={{position:'absolute',inset:0,zIndex:1,background:'radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,.7) 100%)',pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,zIndex:1,background:'rgba(0,0,0,.3)',pointerEvents:'none'}}/>
      <div className="relative flex flex-col h-full" style={{zIndex:2}}>
        <Navbar/>
        <div className="flex-1 flex flex-col items-center justify-center pt-28 px-4 text-center pb-10">
          <div className="fu go flex items-center gap-2 lg rounded-full px-1.5 py-1.5 mb-8" style={{animationDelay:'.2s'}}>
            <span className="bg-white text-black px-3 py-1 rounded-full text-xs font-semibold font-body">Nuevo</span>
            <span className="text-sm text-white/90 font-body pr-3">Distribución autorizada Voltena &amp; Nabota · México 2025</span>
          </div>

/* ── ProductCard ── */
function ProductCard({p,i,accent}){
  const[hov,setHov]=useState(false);
  const ref=useRef(null);
  const[vis,setVis]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setTimeout(()=>setVis(true),i*110);obs.disconnect();}},{threshold:.07});
    if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
  },[i]);

  // 3D tilt on mousemove
  const onMouseMove=useCallback(e=>{
    const card=ref.current;if(!card)return;
    const r=card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    card.style.transform=`translateY(-8px) rotateX(${-y*10}deg) rotateY(${x*10}deg)`;
  },[]);
  const onMouseLeave=useCallback(()=>{if(ref.current)ref.current.style.transform='';setHov(false);},[]);

  return(
    <div ref={ref} className="pcard lg rounded-[1.5rem] flex flex-col overflow-hidden"
      style={{opacity:vis?1:0,translate:vis?'0 0':'0 32px',transition:'opacity .6s ease, translate .6s ease, transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s, border-color .3s',border:`1px solid ${hov?p.color+'50':'rgba(255,255,255,0.07)'}`,boxShadow:hov?`0 28px 70px ${p.color}20`:'none',transformStyle:'preserve-3d',minHeight:480}}
      onMouseEnter={()=>setHov(true)}
      onMouseMove={onMouseMove}
      onMouseLeave={onMouseLeave}>

      {/* Image */}
      <div style={{padding:'24px 24px 0',perspective:800}}>
        <div className="prod-img" style={{borderRadius:12,overflow:'hidden',background:`linear-gradient(135deg,${p.color}15,${p.color}08)`,boxShadow:hov?`0 20px 50px rgba(0,0,0,.7)`:'0 8px 24px rgba(0,0,0,.4)',animation:hov?'none':'floatImg 4s ease-in-out infinite',animationDelay:`${i*.5}s`}}>
          <img src={p.img} alt={p.name} style={{width:'100%',height:200,objectFit:'cover',display:'block',borderRadius:10}}/>
        </div>
      </div>

      {/* Tags */}
      <div style={{display:'flex',flexWrap:'wrap',gap:6,padding:'16px 20px 0'}}>
        {p.tags.map(t=><span key={t} className="lg rounded-full text-[10px] text-white/65 font-body whitespace-nowrap" style={{padding:'3px 10px'}}>{t}</span>)}
      </div>

      <div style={{flex:1}}/>

      {/* Info */}
      <div style={{padding:'16px 22px 22px',borderTop:`1px solid ${p.color}20`,marginTop:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <span className="font-body text-[9px] tracking-[.2em] uppercase" style={{color:p.color}}>{p.cert}</span>
          <span className="font-body text-[9px] text-white/30 tracking-wide">{p.fab}</span>
        </div>
        <div style={{width:hov?40:18,height:2,background:p.color,marginBottom:10,transition:'width .4s'}}/>
        <h3 className="font-heading italic text-white leading-none tracking-[-1px]" style={{fontSize:28}}>{p.name}</h3>
        <p className="font-body text-white/40 text-[10px] tracking-widest uppercase mt-1">{p.sub}</p>
        <p className="font-body text-white/60 text-xs leading-snug mt-3" style={{maxWidth:'30ch'}}>{p.body}</p>
        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:14,color:p.color,fontSize:11,opacity:hov?1:0,transform:hov?'none':'translateY(4px)',transition:'all .3s',fontFamily:'Barlow,sans-serif'}}>
          Cotizar ahora <AUR s={11}/>
        </div>
      </div>
    </div>
  );
}
