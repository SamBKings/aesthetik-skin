/* ── useInView ── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

            <span style={{ fontSize: 10, letterSpacing: '0.3em', color: accentColor, textTransform: 'uppercase' }}>Certificaciones</span>
            <div style={{ width: 24, height: 1, background: accentColor }} />
          </div>
          <h2 style={{
            fontFamily: "'Cormorant Garamond', serif",
            fontSize: 'clamp(32px, 3.5vw, 56px)', fontWeight: 300,
            color: fg,
          }}>
            Respaldo internacional
          </h2>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, background: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)' }}>
          {certs.map((c) => (
            <CertCard key={c.code} cert={c} isDark={isDark} fg={fg} />
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── CTA SECTION ── */
function CtaSection({ theme, accentColor }) {
  const [ref, visible] = useInView();
  const isDark = theme === 'dark';
  const bg = isDark ? '#0b0a08' : '#f5f0e8';
  const fg = isDark ? T.cream : '#1a1612';

  return (
    <section style={{ background: bg, padding: '140px 48px', position: 'relative', overflow: 'hidden' }}>
      <div style={{
        position: 'absolute', top: '50%', left: '50%',
        transform: 'translate(-50%, -50%)',
        width: 800, height: 800, borderRadius: '50%',
        background: `radial-gradient(circle, ${accentColor}10 0%, transparent 70%)`,
        pointerEvents: 'none',
      }} />
      <div ref={ref} style={{
        maxWidth: 700, margin: '0 auto', textAlign: 'center',
        opacity: visible ? 1 : 0, transform: visible ? 'none' : 'translateY(32px)',
        transition: 'all 0.9s cubic-bezier(0.16,1,0.3,1)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, marginBottom: 32 }}>
          <div style={{ width: 24, height: 1, background: accentColor }} />
          <span style={{ fontSize: 10, letterSpacing: '0.3em', color: accentColor, textTransform: 'uppercase' }}>Distribución autorizada</span>
          <div style={{ width: 24, height: 1, background: accentColor }} />
        </div>

        <h2 style={{
          fontFamily: "'Cormorant Garamond', serif",
          fontSize: 'clamp(40px, 5vw, 72px)', fontWeight: 300,
          color: fg, lineHeight: 1.1, marginBottom: 24,
        }}>
          ¿Listo para elevar tu<br /><em style={{ color: accentColor }}>clínica?</em>
        </h2>
        <p style={{ fontSize: 14, color: T.muted, lineHeight: 1.8, marginBottom: 48, fontWeight: 300 }}>
          Contáctanos para cotizar productos originales certificados. Atención directa para profesionales de la salud estética.
        </p>

        <div style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap' }}>
          <button style={{
            padding: '18px 48px', background: accentColor,
            border: 'none', color: '#0b0a08',
            fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase',
            cursor: 'pointer', fontFamily: "'DM Sans', sans-serif", fontWeight: 500,
            display: 'flex', alignItems: 'center', gap: 10,
            transition: 'all 0.3s',
          }}
          onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = `0 16px 48px ${accentColor}40`; }}
          onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = 'none'; }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.524 5.845L.057 23.214a.5.5 0 00.6.63l5.498-1.43A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            Cotizar por WhatsApp
          </button>
          <button style={{
            padding: '18px 48px', background: 'transparent',
            border: `1px solid ${isDark ? 'rgba(237,232,224,0.2)' : 'rgba(26,22,18,0.2)'}`,
            color: fg, fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase',
            cursor: 'pointer', fontFamily: "'DM Sans', sans-serif",
            transition: 'all 0.3s',
          }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = accentColor; e.currentTarget.style.color = accentColor; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = isDark ? 'rgba(237,232,224,0.2)' : 'rgba(26,22,18,0.2)'; e.currentTarget.style.color = fg; }}>
            Ver Catálogo
          </button>
        </div>
      </div>
    </section>
  );
}

/* ── FOOTER ── */
function Footer({ theme, accentColor }) {
  const isDark = theme === 'dark';
  const bg = isDark ? '#080706' : '#e0d9cc';
  const fg = isDark ? T.cream : '#1a1612';
  return (
    <footer style={{ background: bg, padding: '48px', borderTop: `1px solid ${isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)'}` }}>
      <div style={{ maxWidth: 1400, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 28, height: 28, borderRadius: '50%', border: `1px solid ${accentColor}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 10, color: accentColor }}>AS</span>
          </div>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.16em', fontWeight: 500, color: fg }}>AESTHETIK SKIN</div>
            <div style={{ fontSize: 9, letterSpacing: '0.2em', color: T.muted }}>Dermocosmética Coreana</div>
          </div>
        </div>
        <div style={{ fontSize: 10, color: T.muted, letterSpacing: '0.1em' }}>© 2025 Aesthetik Skin · México</div>
        <div style={{ display: 'flex', gap: 24 }}>
          {['Privacidad','Términos','Contacto'].map(l => (
            <a key={l} href="#" style={{ fontSize: 10, letterSpacing: '0.15em', color: T.muted, textDecoration: 'none', transition: 'color 0.2s' }}
              onMouseEnter={e => e.target.style.color = accentColor}
              onMouseLeave={e => e.target.style.color = T.muted}>{l}</a>
          ))}
        </div>
      </div>
    </footer>
  );
}

/* ── APP ── */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const theme = t.theme || 'dark';
  const accentColor = t.accentColor || '#b9985a';
  const heroLayout = t.heroLayout || 'split';

  return (
    <div>
      <Nav theme={theme} accentColor={accentColor} />
      <Hero theme={theme} accentColor={accentColor} heroLayout={heroLayout} />
      <ProductsSection theme={theme} accentColor={accentColor} />
      <Certifications theme={theme} accentColor={accentColor} />
      <CtaSection theme={theme} accentColor={accentColor} />
      <Footer theme={theme} accentColor={accentColor} />

      <TweaksPanel>
        <TweakSection label="Tema" />
        <TweakRadio label="Modo" value={theme} options={['dark','light']} onChange={v => setTweak('theme', v)} />
        <TweakSection label="Color acento" />
        <TweakColor label="Acento" value={accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakSection label="Layout hero" />
        <TweakRadio label="Columnas" value={heroLayout} options={['split','centered']} onChange={v => setTweak('heroLayout', v)} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<div id="root"></div>
</body>
</html>
